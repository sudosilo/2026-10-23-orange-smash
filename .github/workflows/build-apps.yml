# Builds the Android APK and Windows installer and publishes them as a GitHub release.
# The app opens the live site, so page updates reach it without a new build.
name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" -R "${{ github.repository }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Smash Director 1.0.${{ github.run_number }}" \
            --notes "Android APK and Windows installer built from commit ${{ github.sha }}."

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare
        shell: bash
        run: |
          node src-tauri/scripts/set-version.cjs "${{ needs.release.outputs.version }}"
          npx --yes @tauri-apps/cli@2 icon src-tauri/app-icon.png
      - name: Build Windows installer
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe "Smash-Director-${{ needs.release.outputs.version }}-setup.exe"
          gh release upload "${{ needs.release.outputs.tag }}" -R "${{ github.repository }}" --clobber \
            "Smash-Director-${{ needs.release.outputs.version }}-setup.exe"

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::The Android signing key secrets are missing. Run tools/android-signing.sh from Termux once."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Find Android NDK
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Android app
        run: |
          set -o pipefail
          {
            node src-tauri/scripts/set-version.cjs "${{ needs.release.outputs.version }}"
            npm pkg set scripts.tauri=tauri
            npm install --no-save @tauri-apps/cli@2
            npm run tauri -- android init --ci
            npm run tauri -- icon src-tauri/app-icon.png
            node src-tauri/scripts/patch-android.cjs
            npm run tauri -- android build --apk --target aarch64 --target armv7
          } 2>&1 | tee android-build.log
      - name: Attach build log if it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 400 android-build.log > android-build-log.txt 2>/dev/null || echo "no log" > android-build-log.txt
          gh release upload "${{ needs.release.outputs.tag }}" -R "${{ github.repository }}" --clobber android-build-log.txt
      - name: Sign APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=$(find src-tauri/gen/android -name "*release*.apk" | head -1)
          echo "$KS" | base64 -d > ks.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS \
            --out "Smash-Director-${{ needs.release.outputs.version }}.apk" aligned.apk
          "$BT/apksigner" verify "Smash-Director-${{ needs.release.outputs.version }}.apk"
          rm -f ks.p12
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" -R "${{ github.repository }}" --clobber \
            "Smash-Director-${{ needs.release.outputs.version }}.apk"

  publish:
    needs: [release, windows, android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish or clean up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          N=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '[.assets[] | select(.name | endswith(".txt") | not)] | length')
          if [ "$N" -gt 0 ]; then
            gh release edit "$TAG" -R "${{ github.repository }}" --prerelease=false --latest
          else
            gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag
          fi
